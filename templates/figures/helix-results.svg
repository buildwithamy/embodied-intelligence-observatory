<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">Figure报告的完整任务成功率：9%与56%</title><desc id="desc">同等任务微调数据和条件下，不使用Index预训练为9%，使用Index预训练为56%。这是Figure在30个未见家庭、三项家务上的公司评测，未独立复现。</desc>
<rect width="760" height="330" fill="#e9eddf"/>
<g font-family="sans-serif" fill="#234837"><text x="32" y="42" font-size="17" font-weight="600">完整任务成功率</text><text x="32" y="66" font-size="11" fill="#60745e">30 个未见家庭 · 三项家务 · Figure 公司评测</text></g>
<g fill="none" stroke="#c5d0bc"><path d="M260 100V257M354 100V257M448 100V257M542 100V257M636 100V257M730 100V257"/></g>
<g font-family="sans-serif" font-size="13" fill="#234837"><text x="32" y="141">无 Index 预训练</text><text x="32" y="211">有 Index 预训练</text></g>
<rect x="260" y="116" width="42.3" height="34" fill="#9bab91"/>
<rect x="260" y="186" width="263.2" height="34" fill="#315c48"/>
<g font-family="Georgia,serif" font-size="28" fill="#234837"><text x="316" y="143">9%</text><text x="537" y="213">56%</text></g>
<g font-family="sans-serif" font-size="10" fill="#71806a" text-anchor="middle"><text x="260" y="276">0</text><text x="354" y="276">20</text><text x="448" y="276">40</text><text x="542" y="276">60</text><text x="636" y="276">80</text><text x="730" y="276">100%</text></g>
<text x="32" y="309" font-family="sans-serif" font-size="11" fill="#60745e">任务均使用其他环境的真机数据微调；“未见”指测试家庭环境与物体。</text>
