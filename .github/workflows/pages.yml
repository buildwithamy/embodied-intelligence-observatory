name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build issue pages
        run: python3 site/previews/issue-01/src/build.py
      - name: Assemble site
        run: |
          mkdir -p _site/issues/01
          cp site/previews/issue-01/index.html site/previews/issue-01/og.png _site/issues/01/
          # The latest issue doubles as the home page; its canonical link points to /issues/01/.
          cp site/previews/issue-01/index.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
