<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-label="端、边、云三层推理架构" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>端、边、云三层推理架构</title><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="52" width="270" height="176" rx="12" stroke="none" style="fill:var(--cream,#f5f0e8)"/><rect x="60" y="72" width="24" height="22" rx="8" style="fill:var(--paper,#ffffff)"/><rect x="64" y="79" width="16" height="7" rx="3.5" style="fill:currentColor" stroke="none"/><circle cx="72" cy="82.5" r="1.6" stroke="none" style="fill:var(--teal,#5db8a6)"/><text x="98" y="84" stroke="none" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" font-size="15" text-anchor="start" style="fill:currentColor" >机器人端</text><text x="98" y="104" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="start" style="fill:var(--muted,#6c6a64)" >驱动器 / MCU + Jetson</text><path d="M58 122 H292" stroke-width="1" stroke-opacity=".25"/><circle cx="64" cy="143" r="3" stroke="none" style="fill:currentColor" fill-opacity=".45"/><text x="76" y="148" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="14" text-anchor="start" style="fill:currentColor" >关节伺服 · 安全</text><text x="292" y="148" stroke="none" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" text-anchor="end" style="fill:currentColor" >kHz 级</text><circle cx="64" cy="171" r="4" stroke="none" style="fill:var(--coral,#cc785c)"/><text x="76" y="176" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="14" text-anchor="start" style="fill:currentColor" >感知 · 小模型策略</text><text x="292" y="176" stroke="none" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" text-anchor="end" style="fill:currentColor" >Jetson</text><rect x="410" y="52" width="270" height="176" rx="12" stroke="none" style="fill:var(--cream,#f5f0e8)"/><path d="M436 70 V74 M436 94 V98 M428 78 H432 M452 78 H456 M442 70 V74 M442 94 V98 M428 84 H432 M452 84 H456 M448 70 V74 M448 94 V98 M428 90 H432 M452 90 H456 " stroke-width="1.5"/><rect x="432" y="74" width="20" height="20" rx="3" style="fill:var(--paper,#ffffff)"/><rect x="437" y="79" width="10" height="10" rx="1.5" stroke="none" style="fill:var(--teal,#5db8a6)"/><text x="468" y="84" stroke="none" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif" font-size="15" text-anchor="start" style="fill:currentColor" >边缘 GPU</text><text x="468" y="104" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="start" style="fill:var(--muted,#6c6a64)" >现场或机房服务器</text><path d="M428 122 H662" stroke-width="1" stroke-opacity=".25"/><circle cx="434" cy="143" r="3" stroke="none" style="fill:currentColor" fill-opacity=".45"/><text x="446" y="148" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="14" text-anchor="start" style="fill:currentColor" >策略推理</text><text x="662" y="148" stroke="none" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" text-anchor="end" style="fill:currentColor" >GPU</text><circle cx="434" cy="171" r="3" stroke="none" style="fill:currentColor" fill-opacity=".45"/><text x="446" y="176" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="14" text-anchor="start" style="fill:currentColor" >输出动作块</text><text x="662" y="176" stroke="none" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" text-anchor="end" style="fill:currentColor" >10–50 Hz</text><rect x="780" y="52" width="270" height="176" rx="12" stroke="none" style="fill:var(--cream,#f5f0e8)"/><path d="M805 92 H820 A5.5 5.5 0 0 0 821 81 A8 8 0 0 0 806 80 A6 6 0 0 0 805 92 Z" style="fill:var(--paper,#ffffff)"/><text x="838" y="84" stroke="none" font-family="'Noto Serif SC'