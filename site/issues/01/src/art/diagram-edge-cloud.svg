e-width="1.5"/><text x="360.0" y="154" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="middle" style="fill:currentColor" >动作块</text><path d="M688 112 H772" stroke-width="1.5"/><path d="M766 107.5 L772 112 L766 116.5" stroke-width="1.5"/><text x="730.0" y="104" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="middle" style="fill:currentColor" >日志 / 数据</text><path d="M688 162 H772" stroke-width="1.5"/><path d="M694 157.5 L688 162 L694 166.5" stroke-width="1.5"/><text x="730.0" y="154" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="middle" style="fill:currentColor" >模型权重</text><text x="40" y="262" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="start" style="fill:var(--muted,#6c6a64)" >延迟低 · 算力有限</text><text x="1050" y="262" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="end" style="fill:var(--muted,#6c6a64)" >延迟高 · 算力充足</text><path d="M168 257 H922" stroke-width="1" stroke-opacity=".4" stroke-dasharray="3 5"/><path d="M916 253 L922 257 L916 261" stroke-width="1" stroke-opacity=".6"/><rect x="40" y="282" width="1010" height="42" rx="8" stroke="none" style="fill:var(--cream,#f5f0e8)"/><rect x="40" y="282" width="4" height="42" stroke="none" style="fill:var(--coral,#cc785c)"/><text x="62" y="308" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="14" text-anchor="start" style="fill:currentColor" >推理放在哪一层，取决于延迟预算、网络抖动和合规（如 FCC 限制推动本地化）。</text><text x="1050" y="350" stroke="none" font-family="Inter,'Noto Sans SC','PingFang SC',sans-serif" font-size="13" text-anchor="end" style="fill:var(--muted,#6c6a64)" >数值为示意</text></g></svg>
